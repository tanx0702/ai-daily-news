name: X Feed

# 定时生成公开 X 信息源快照；日报生产任务只读取发布后的静态 JSON。
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: x-feed-public-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install feed dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Collect public X feed
        run: >-
          python -m scripts.x_web_feed
          --sources config/x_sources.json
          --work-dir artifacts/x-feed
          --output artifacts/x-feed/x-feed.json
      - name: Upload feed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-feed
          path: artifacts/x-feed
          if-no-files-found: warn
      - uses: actions/checkout@v4
        if: success()
        with:
          ref: x-feed
          path: x-feed
      - name: Publish static X feed
        if: success()
        run: |
          cp artifacts/x-feed/x-feed.json x-feed/x-feed.json
          git -C x-feed config user.name "github-actions[bot]"
          git -C x-feed config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C x-feed add x-feed.json
          git -C x-feed diff --cached --quiet || git -C x-feed commit -m "data: 更新 X 信息源快照"
          git -C x-feed push origin HEAD:x-feed
