services:
  web:
    build: .
    container_name: ai-news-web
    restart: always
    volumes:
      - ./docs:/app/docs
      - ./src:/app/src
      - ./app.py:/app/app.py
      - ./config:/app/config
    env_file:
      - .env
    environment:                         
    - TZ=Asia/Shanghai                

  nginx:
    image: nginx:alpine
    container_name: ai-news-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
