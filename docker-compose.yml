services:
  web:
    build: .
    container_name: ai-news-web
    restart: always
    volumes:
      - ./docs:/app/docs
      - ./logs:/app/logs
      - ./src:/app/src
      - ./app.py:/app/app.py
      - ./templates:/app/templates:ro
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: ai-news-nginx
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docs:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
