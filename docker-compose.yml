services:
  web:
    build: .
    container_name: ai-news-web
    restart: always
    volumes:
      - ./docs:/app/docs
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: ai-news-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs:/usr/share/nginx/html:ro
    depends_on:
      - web
